<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable · Togo, musée d'art et d'histoire</title>
<script>
// Fonctionne sous la racine (Vercel) comme sous /togo-bibliotheque-histoire/ (GitHub Pages).
var base = location.pathname.indexOf('/togo-bibliotheque-histoire/') === 0 ? '/togo-bibliotheque-histoire/' : '/';
var reste = location.pathname.slice(base.length);
// Anciens liens de l'aperçu, retiré le 16/11/2026 : on renvoie vers la page publiée.
if (/^apercu(\/|$)/.test(reste)) location.replace(base + reste.replace(/^apercu\/?/, '') + location.search + location.hash);
</script>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: #14110F; color: #EFE6D6; font: 1.05rem/1.6 Georgia, "Times New Roman", serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; text-align: center; }
  h1 { font-weight: 400; font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0 0 .5em; }
  p { margin: 0 0 1.5em; opacity: .8; }
  a { color: #EFE6D6; border: 1px solid #EFE6D6; padding: .7em 1.4em; text-decoration: none; display: inline-block; }
  a:hover, a:focus-visible { background: #EFE6D6; color: #14110F; }
</style>
</head>
<body>
<main>
  <h1>Cette page n'existe pas, ou plus.</h1>
  <p>Le musée, lui, est toujours ouvert.</p>
  <a id="entrer" href="./">Entrer au musée</a>
</main>
<script>document.getElementById('entrer').href = base;</script>
</body>
</html>
